<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Wave Quantum Synthesizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- site audio & quantum engine CDNs -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h1>4-Wave Qubit Synthesizer</h1>
    <p class="subtitle">Control a 2-qubit system to morph between Sine, Triangle, Square, and Sawtooth waveforms.</p>
    
    <button id="start-audio">Activate Audio Engine</button>

    <div class="slider-group">
        <label for="theta1">Qubit 1 Bias (θ₁): <span id="theta1-val">0</span> rad</label>
        <input id="theta1" type="range" min="0" max="3.1416" step="0.01" value="0" disabled>
    </div>

    <div class="slider-group">
        <label for="theta2">Qubit 2 Bias (θ₂): <span id="theta2-val">0</span> rad</label>
        <input id="theta2" type="range" min="0" max="3.1416" step="0.01" value="0" disabled>
    </div>

    <div class="slider-group">
        <label for="phi">Phase Angle (φ): <span id="phi-val">0</span> rad</label>
        <input id="phi" type="range" min="0" max="6.2831" step="0.01" value="0" disabled>
    </div>

    <div class="data-display">
        <strong>Quantum State |Ψ⟩ Distributions:</strong><br>
        <span id="state-vector">Initialize audio to observe state vector.</span>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
